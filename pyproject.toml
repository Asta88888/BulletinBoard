[tool.poetry]
name = "bulletinboard"
version = "0.1.0"
description = ""
authors = ["Anastasiya Soloviova <mafanya.as@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
django = "^5.2.6"
pillow = "^11.3.0"
python-dotenv = "^1.1.1"
psycopg2-binary = "^2.9.10"
djangorestframework = "^3.16.1"
django-filter = "^25.1"
djangorestframework-simplejwt = "^5.5.1"
coverage = "^7.10.7"
drf-yasg = "^1.21.11"
redis = "^6.4.0"
requests = "^2.32.5"
drf-nested-routers = "^0.95.0"
django-cors-headers = "^4.9.0"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ''' ( /( \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist )/
    | foo.py
      ) '''
